name: Process Submission

on:
  issues:
    types: [opened, reopened]

concurrency:
  group: submission-process
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # 作品受付は 2026/08/31 (JST) をもって終了しました。
  # submission ラベル付きの Issue が作成された場合でも、エントリー処理は行わず、
  # 受付終了の案内コメントを返して自動的にクローズします。
  closed:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'submission')
    steps:
      - name: Notify submissions closed and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const siteUrl = 'https://haukun.github.io/p5js-baton-fireworks/';
            const body = [
              '## 🙇 作品の受付は終了しました / Submissions are now closed',
              '',
              'この企画の作品受付は **2026/08/31 (JST)** をもって終了しました。',
              '新規投稿および作品の変更（更新）はできません。ご参加ありがとうございました！',
              '',
              'The submission period ended on **2026/08/31 (JST)**.',
              'New submissions and updates are no longer accepted. Thank you for participating!',
              '',
              '---',
              '',
              `- 🎆 ギャラリーで作品を見る / View the gallery: ${siteUrl}`,
              '- 🗑️ 投稿済み作品の削除は引き続き可能です。「作品を削除する / Delete a Sketch」からどうぞ。',
              '  You can still delete your submission via "🗑️ Delete a Sketch".',
              '',
              '---',
              '*このIssueは自動クローズされます。 / This issue will be closed automatically.*',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['submission', 'closed'],
            });
